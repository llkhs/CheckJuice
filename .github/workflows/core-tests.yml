name: Core Tests

# 只负责验证「核心算法包」：编译 + 单元测试 + 与 Python 参考实现的一致性。
# App / Widget 的构建与签名在单独的 workflow 里做，避免一个环节卡住全部反馈。
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: core-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    # ⚠️ 必须 macos-15 及以上：macos-14 预装的 Xcode 15 没有 iOS 17 之后的 SDK，
    #    本项目 requirements 是 Xcode 26 / iOS 26 SDK，跑不起来。
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: 打印工具链版本
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          python3 --version

      - name: 核心包单元测试
        working-directory: CheckJuiceCore
        run: |
          # set +e：先把结果抓下来，再决定退出码，否则失败就直接跳过了上报。
          set +e
          swift test 2>&1 | tee /tmp/swift-test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            bash ../.github/scripts/report-errors.sh /tmp/swift-test.log
          fi
          exit "$status"

      - name: 校验黄金数值与 Python 参考实现一致
        # 这是本项目的核心不变量：Swift 实现必须与 Python 参考实现给出同样的数值。
        # 谁改了算法却忘了同步，这里会直接红。
        run: |
          python3 reference/emit_golden.py > /dev/null
          if ! diff -u \
            CheckJuiceCore/Tests/CheckJuiceCoreTests/Resources/golden_values.json \
            reference/golden_values.json; then
            echo "::error::黄金数值与 Python 参考实现不一致。"
            echo "::error::要么算法改动没同步到两边，要么忘了刷新测试资源。"
            exit 1
          fi
          echo "黄金数值一致 ✅"
