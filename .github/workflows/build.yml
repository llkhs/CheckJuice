name: Build

# CI 只负责「能不能编译过」和「产出一个可签名的 IPA」。
# 签名在手机端做（Esign 之类），所以这里 CODE_SIGNING_ALLOWED=NO。
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'          # 文档改了跟编译无关，别占 runner
      - 'reference/**'   # Python 参考实现只服务 Core Tests，不影响 App 构建
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'reference/**'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios:
    # macos-15 自带 Xcode 16.x，编 iOS 17 目标足够。
    # 若以后要 iOS 26 SDK，把这里换成更新的 runner。
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: 打印工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        run: |
          set +e
          xcodegen generate 2>&1 | tee /tmp/xcodegen.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # project.yml 语法错误在这里暴露，是反馈最快的失败点。
            bash .github/scripts/report-errors.sh /tmp/xcodegen.log 'error|Error'
          fi
          exit "$status"

      - name: 校验 Bundle ID 前缀关系
        # 提前暴露「嵌入二进制 bundle id 不是主 App 前缀」这类错误。
        # 它若在编译后才报，会浪费一整个构建周期才知道原因。
        run: bash .github/scripts/dump-bundle-ids.sh

      - name: 编译（不签名）
        run: |
          set +e
          xcodebuild \
            -project CheckJuice.xcodeproj \
            -scheme CheckJuice \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee /tmp/xcodebuild.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            bash .github/scripts/report-errors.sh /tmp/xcodebuild.log
          fi
          exit "$status"

      - name: 失败诊断：打印产物内实际的 bundle id
        # 只在上一步失败时跑。目的是把「构建产物里真正写进去了什么」暴露出来，
        # 而不是只看构建配置声明了什么 —— 两者不一致正是嵌入校验失败的原因。
        if: failure()
        run: |
          count=0
          for bundle in $(find build/Build/Products -maxdepth 4 \( -name '*.appex' -o -name '*.app' \) 2>/dev/null); do
            count=$((count + 1))
            id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$bundle/Info.plist" 2>/dev/null || echo '（读取失败）')
            echo "::error::产物 ${bundle#build/Build/Products/} → CFBundleIdentifier = $id"
          done
          if [ "$count" -eq 0 ]; then
            echo "::error::build/Build/Products 下找不到任何 .app/.appex，构建可能更早就失败了"
          fi

      - name: 校验图标真的进了产物
        # ⚠️ 这一步不能省。
        #
        # 忘了在 project.yml 里设 ASSETCATALOG_COMPILER_APPICON_NAME 时，
        # 资源目录里那张图会被**静默忽略**：构建成功、测试全绿、桌面是白图标。
        # XcodeGen 不会替你加这行，Xcode 新建工程时却是模板自带 ——
        # 所以这个坑对新项目特别容易踩，而且踩了没有任何提示。
        #
        # 因此不能相信构建配置，要直接检查**产物里到底有什么**。
        run: |
          APP="build/Build/Products/Release-iphoneos/CheckJuice.app"
          echo "--- .app 根目录下含 icon 的文件 ---"
          ls -la "$APP" | grep -i 'icon' || echo "（一个都没有）"
          echo "--- Info.plist 里的图标信息 ---"
          for key in CFBundleIconName CFBundleIcons CFBundleIcons~ipad; do
            printf '%s = ' "$key"
            /usr/libexec/PlistBuddy -c "Print :$key" "$APP/Info.plist" 2>/dev/null || echo "（缺）"
          done
          echo "--- Assets.car 是否编出来 ---"
          ls -la "$APP/Assets.car" 2>/dev/null || echo "（没有 Assets.car）"

          # 用显式 if 而不是 `cmd && var=1`：GitHub Actions 的 bash 带 -e，
          # AND 列表的失败虽然不会中止脚本，但那种「靠规则细节才不出事」的写法
          # 不值得留 —— 显式写出来谁读都清楚。
          png_ok=0
          if ls "$APP"/AppIcon*.png >/dev/null 2>&1; then png_ok=1; fi
          name_ok=0
          if /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist" >/dev/null 2>&1; then
            name_ok=1
          fi

          if [ "$png_ok" -eq 0 ] && [ "$name_ok" -eq 0 ]; then
            echo "::error::产物里找不到任何 App 图标（既没有 AppIcon*.png，也没有 CFBundleIconName）—— 多半是 project.yml 缺 ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon"
            exit 1
          fi
          # 关键结论抛成 notice：只写进 echo 的话，这一步跑没跑、结果如何，
          # 页面上一概看不见 —— 那等于校验了个寂寞。
          # notice 会出现在 run 页面的 Annotations 里，一眼可查。
          ICON_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$APP/Info.plist" 2>/dev/null || echo '（未设置）')
          ICON_FILES=$(ls "$APP"/AppIcon*.png 2>/dev/null | wc -l | tr -d ' ')
          echo "::notice::图标校验通过 —— 产物里有 ${ICON_FILES} 个 AppIcon*.png，CFBundleIconName=${ICON_NAME}，Assets.car $([ -f "$APP/Assets.car" ] && echo 有 || echo 无)"

      - name: 打包未签名 IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/CheckJuice.app"
          test -d "$APP" || { echo "找不到 $APP"; ls -R build/Build/Products; exit 1; }
          echo "--- 扩展是否被打进去 ---"
          ls -la "$APP/PlugIns" || echo "⚠️ PlugIns 目录不存在，小组件没被嵌入"
          rm -rf Payload CheckJuice-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry CheckJuice-unsigned.ipa Payload
          ls -lh CheckJuice-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v7
        with:
          name: CheckJuice-unsigned-ipa
          path: CheckJuice-unsigned.ipa
          if-no-files-found: error
